# BorealOS lightdm defaults
#
# - use lightdm-gtk-greeter explicitly (not the generic alternatives alias)
# - show the user list (greeter-hide-users=false) but with no avatar image
#   at all - see hide-user-image=true in lightdm-gtk-greeter.conf.d. This
#   used to rely on installer.sh/boreal-installer.c setting a .face image
#   for every user so an avatar would show; that .face setup was removed
#   (it was showing our own logo, not what was wanted), and rather than
#   leave every user showing the greeter's generic default silhouette
#   instead, hide-user-image suppresses the image slot entirely - no
#   custom avatar, no generic fallback either.
# - use Debian specific session wrapper, to gain support for
#   /etc/X11/Xsession.d scripts

[Seat:*]
greeter-session=lightdm-gtk-greeter
greeter-hide-users=false
greeter-show-manual-login=false
session-wrapper=/etc/X11/Xsession
# Rounded/transparent corners on the greeter (see gtk.css's #boreal-dialog /
# #boreal-window rules) need real alpha compositing to actually punch
# through - GTK's border-radius alone just clips paint inside a still-square
# X11 window, so without a compositor the corners outside the curve render
# as solid black instead of see-through. display-setup-script runs as root
# on the X server before the greeter connects, so this is the one place to
# start a compositor for the greeter's own session (the installed desktop
# session gets its own compositing via xfwm4's use_compositing).
display-setup-script=/usr/local/bin/boreal-greeter-compositor
